<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu App Sem Barra</title>

    <!-- ✅ ISSO AQUI ESCONDE A BARRA DE PESQUISA -->
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTWV1IEFwcCIsInNob3J0X25hbWUiOiJBcHAiLCJzdGFydF91cmwiOiIuaW5kZXguaHRtbCIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwYTc0YzciLCJ0aGVtZV9jb2xvciI6IiMwYTc0YzciLCJpY29ucyI6W3sic3JjIjoiaHR0cHM6Ly9pY29ucy5wbmcvcmljaC81OTIvMTkyMDUxOC5wbmciLCJzaXplcyI6IjE5MngxOTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIn1dfQ==">
    <meta name="theme-color" content="#0284c7">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body {
            background: linear-gradient(135deg, #0a2463, #0284c7);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .caixa {
            background: white;
            color: #0a2463;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 22px; margin-bottom: 8px; }
        p { color: #666; margin-bottom: 20px; }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 16px;
            width: 100%;
            margin: 6px 0;
            cursor: pointer;
        }
        button:hover { background: #036ea8; }
        .status { margin-top: 16px; font-size: 14px; color: green; }
        .aviso { font-size: 13px; color: #888; margin-top: 12px; }
    </style>
</head>
<body>

<div class="caixa">
    <h1>📱 Aplicativo Sem Barra</h1>
    <p>Instale e abra pelo ícone → a barra SOME!</p>

    <button onclick="testar()">✅ Testar Funcionamento</button>
    <button onclick="instalar()">📲 Instalar na Tela Inicial</button>

    <div class="status" id="status">✅ Carregado com sucesso!</div>
    <div class="aviso" id="aviso">⚠️ Abra pelo ícone instalado → barra de pesquisa DESAPARECE</div>
</div>

<script>
    // 📲 FUNÇÃO DE INSTALAÇÃO
    let promptInstalar;

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        promptInstalar = e;
        status.textContent = '📲 Pronto para instalar!';
    });

    function instalar() {
        if (!promptInstalar) {
            alert('ℹ️ Já está instalado ou não disponível.\n\nInstale manualmente:\n⋮ (menu do navegador) → "Adicionar à tela inicial"');
            return;
        }
        promptInstalar.prompt();
        promptInstalar.userChoice.then(choice => {
            status.textContent = choice.outcome === 'accepted' 
                ? '🎉 INSTALADO COM SUCESSO!' 
                : '⚠️ Instalação cancelada';
            promptInstalar = null;
        });
    }

    function testar() {
        alert('✅ Tudo funcionando perfeitamente!\n\n📲 Instale o app e abra pelo ícone → a barra de pesquisa SOME!');
    }
</script>

</body>
</html>
