<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRUCO MINEIRO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #0f4c3a; color: white; min-height: 100vh; padding: 10px; }
        h1 { text-align: center; color: #ffd700; margin-bottom: 15px; }
        .placar { display: flex; justify-content: space-around; font-size: 1.8rem; font-weight: bold; margin-bottom: 15px; }
        .placar > div { padding: 10px 20px; background: #1a6b52; border-radius: 10px; }
        .area-cartas { display: flex; justify-content: center; gap: 10px; margin: 15px 0; flex-wrap: wrap; }
        .carta { width: 90px; height: 130px; background: white; color: #000; border-radius: 10px; border: 3px solid #333; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .carta:hover { transform: translateY(-8px); border-color: #ffd700; }
        .carta-costas { width: 90px; height: 130px; background: #8b0000; color: white; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .carta-jogada { width: 100px; height: 140px; background: white; color: #000; border-radius: 10px; border: 4px solid #ffd700; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 1.3rem; }
        .area-jogada { display: flex; justify-content: space-around; margin: 20px 0; }
        .resultado { text-align: center; font-size: 1.1rem; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 10px; margin: 10px 0; min-height: 50px; }
        .area-botoes { margin-top: 15px; min-height: 70px; }
        button { cursor: pointer; font-size: 1rem; border-radius: 8px; font-weight: bold; border: none; }
        #botao-nova-rodada { display: block; margin: 15px auto; padding: 12px 25px; background: #ffd700; color: #000; font-size: 1.1rem; opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

    <h1>🃏 TRUCO MINEIRO</h1>

    <div class="placar">
        <div>VOCÊ<br><span id="placar-jogador">0</span></div>
        <div>JOÃO<br><span id="placar-joao">0</span></div>
    </div>

    <div id="cartas-joao" class="area-cartas"></div>
    <div class="area-jogada">
        <div id="carta-jogada-joao"></div>
        <div id="carta-jogada-jogador"></div>
    </div>
    <div id="cartas-jogador" class="area-cartas"></div>

    <div id="resultado-rodada" class="resultado">Clique em uma carta para jogar!</div>
    <div id="area-pedidos" class="area-botoes"></div>

    <button id="botao-nova-rodada">🔄 NOVA PARTIDA</button>

<script>
// ===== CONFIGURAÇÕES =====
const PONTOS_PARTIDA = 12;
const LIMITE_MAO_DE_10 = 10;
const ETAPAS = [
    { nome: 'truco', valor: 4, recusa: 2 },
    { nome: 'seis', valor: 8, recusa: 4 },
    { nome: 'nove', valor: 12, recusa: 6 }
];
const CORES = { truco: '#ffd700', seis: '#ff6600', nove: '#e50000' };

let pontosJogador = 0;
let pontosJoao = 0;
let cartasJogador = [];
let cartasJoao = [];
let baralho = [];
let vitoriasRodadaJogador = 0;
let vitoriasRodadaJoao = 0;
let valorAtualRodada = 2;
let indiceEtapa = -1;
let aguardandoResposta = false;
let quemPediu = null;
let vezDeJogar = 'jogador';
let podeJogar = true;
let quemJogaPrimeiro = 'jogador';
let cartaJogadaJogador = null;
let cartaJogadaJoao = null;
let rodadaEmAndamento = false;

let placarJogadorEl, placarJoaoEl, cartasJogadorEl, cartasJoaoEl;
let cartaJogadaJogadorEl, cartaJogadaJoaoEl, resultadoRodadaEl, areaPedidosEl;
let botaoNovaRodada;

// ===== FORÇA DAS CARTAS =====
function obterForca(valor, naipe) {
    if (valor === '4' && naipe === 'paus') return 14;
    if (valor === '7' && naipe === 'copas') return 13;
    if (valor === 'A' && naipe === 'espadas') return 12;
    if (valor === '7' && naipe === 'ouros') return 11;
    const ordem = { '3': 10, '2': 9, 'A': 8, 'K': 7, 'J': 6, 'Q': 5, '7': 4, '6': 3, '5': 2, '4': 1 };
    return ordem[valor] || 0;
}

// ===== CRIAR BARALHO =====
function criarBaralho() {
    const valores = ['4','5','6','7','Q','J','K','A','2','3'];
    const naipes = ['ouros','copas','espadas','paus'];
    baralho = [];
    valores.forEach(valor => {
        naipes.forEach(naipe => {
            baralho.push({ valor, naipe, forca: obterForca(valor, naipe) });
        });
    });
    baralho.sort(() => Math.random() - 0.5);
}

// ===== INICIAR RODADA =====
function iniciarNovaRodada() {
    rodadaEmAndamento = true;
    criarBaralho();
    cartasJogador = baralho.splice(0, 3);
    cartasJoao = baralho.splice(0, 3);
    vitoriasRodadaJogador = vitoriasRodadaJoao = 0;
    cartaJogadaJogador = cartaJogadaJoao = null;
    valorAtualRodada = 2;
    indiceEtapa = -1;
    aguardandoResposta = false;
    quemPediu = null;
    vezDeJogar = quemJogaPrimeiro;
    podeJogar = true;

    cartaJogadaJogadorEl.innerHTML = '';
    cartaJogadaJoaoEl.innerHTML = '';

    let voceNaMaoDeDez = (pontosJogador === LIMITE_MAO_DE_10);
    let joaoNaMaoDeDez = (pontosJoao === LIMITE_MAO_DE_10);

    // VOCÊ NA MÃO DE 10
    if (voceNaMaoDeDez && quemJogaPrimeiro === 'jogador') {
        resultadoRodadaEl.textContent = '✋ MÃO DE 10! Veja suas cartas e decida!';
        exibirCartas(); exibirCartasJoao();
        areaPedidosEl.innerHTML = `
            <div style="display:flex; gap:10px; justify-content:center; margin-top:10px;">
                <button onclick="aceitarIrMaoDeDez()" style="padding:12px 20px; background:#28a745; color:white; border:none; border-radius:8px; font-weight:bold;">✅ VOU JOGAR</button>
                <button onclick="correrMaoDeDez()" style="padding:12px 20px; background:#ffc107; color:#000; border:none; border-radius:8px; font-weight:bold;">🏃 CORRER (+2pts João)</button>
            </div>
            <p style="text-align:center; color:#ffd700; font-size:0.85rem; margin-top:8px;">Pode correr quantas vezes quiser! Cada corrida = +2pts e cartas novas!</p>`;
        podeJogar = false;
        return;
    }

    // JOÃO NA MÃO DE 10
    if (joaoNaMaoDeDez && quemJogaPrimeiro === 'joao') {
        resultadoRodadaEl.textContent = '✋ JOÃO ESTÁ NA MÃO DE 10! Ele decide...';
        areaPedidosEl.innerHTML = '<span style="color:#ffc107; font-weight:bold;">🤔 João olha as cartas...</span>';
        podeJogar = false;
        setTimeout(() => {
            let forcas = cartasJoao.map(c => c.forca);
            let melhor = Math.max(...forcas);
            let aceita = Math.random() < (melhor >= 8 ? 0.90 : melhor >= 5 ? 0.45 : 0.15);
            if (aceita) {
                areaPedidosEl.innerHTML = '<span style="color:#28a745; font-weight:bold;">✅ JOÃO DECIDIU JOGAR!</span>';
                setTimeout(() => {
                    areaPedidosEl.innerHTML = '';
                    exibirCartas(); exibirCartasJoao(); atualizarBotoesPedido();
                    setTimeout(() => joaoJoga(), 1500);
                }, 1200);
            } else {
                areaPedidosEl.innerHTML = '<span style="color:#ffc107; font-weight:bold;">🏃 JOÃO CORREU! VOCÊ GANHA +2pts!</span>';
                pontosJogador += 2; atualizarPlacar();
                if (verificarFimDePartida()) return;
                setTimeout(() => iniciarNovaRodada(), 2500);
            }
        }, 2000);
        return;
    }

    // RODADA NORMAL
    resultadoRodadaEl.textContent = '🃏 Clique em uma carta para jogar!';
    exibirCartas(); exibirCartasJoao(); atualizarBotoesPedido();
    if (vezDeJogar === 'joao') { podeJogar = false; setTimeout(() => joaoJoga(), 1500); }
}

// ===== CORRER NA MÃO DE 10 =====
window.correrMaoDeDez = function() {
    pontosJoao += 2;
    resultadoRodadaEl.textContent = '🏃 VOCÊ CORREU! JOÃO GANHA +2 PONTOS! Cartas novas...';
    areaPedidosEl.innerHTML = '';
    atualizarPlacar();
    if (verificarFimDePartida()) return;
    setTimeout(() => iniciarNovaRodada(), 2500);
};

window.aceitarIrMaoDeDez = function() {
    resultadoRodadaEl.textContent = '✅ VOCÊ DECIDIU JOGAR! Se perder, João ganha 4pts!';
    areaPedidosEl.innerHTML = '';
    podeJogar = true;
    atualizarBotoesPedido();
};

// ===== EXIBIR CARTAS =====
function exibirCartas() {
    cartasJogadorEl.innerHTML = '';
    cartasJogador.forEach((carta, i) => {
        let btn = document.createElement('button');
        btn.className = 'carta';
        btn.innerHTML = `${carta.valor}<br><small>${carta.naipe}</small>`;
        btn.onclick = () => jogarCarta(i);
        cartasJogadorEl.appendChild(btn);
    });
}

function exibirCartasJoao() {
    cartasJoaoEl.innerHTML = '';
    cartasJoao.forEach(() => {
        let el = document.createElement('div');
        el.className = 'carta-costas';
        el.textContent = '🃏';
        cartasJoaoEl.appendChild(el);
    });
}

// ===== JOGAR CARTA =====
window.jogarCarta = function(indice) {
    if (!podeJogar || vezDeJogar !== 'jogador' || aguardandoResposta) return;
    let carta = cartasJogador.splice(indice, 1)[0];
    cartaJogadaJogador = carta;
    exibirCartas();
    cartaJogadaJogadorEl.innerHTML = `<div class="carta-jogada">${carta.valor}<br><small>${carta.naipe}</small></div>`;
    podeJogar = false;
    vezDeJogar = 'joao';
    setTimeout(() => verificarSeAmbosJogaram(), 800);
};

// ===== JOÃO JOGA =====
function joaoJoga() {
    if (cartaJogadaJoao !== null) return;
    if (Math.random() < 0.12 && !aguardandoResposta && indiceEtapa < 2) {
        joaoPedeAumento();
        return;
    }
    let indice = cartasJoao.findIndex(c => c.forca >= (cartaJogadaJogador?.forca || 0) + 1);
    if (indice === -1) indice = cartasJoao.map(c=>c.forca).sort((a,b)=>b-a).findIndex(f=>f===Math.max(...cartasJoao.map(c=>c.forca)));
    if (indice === -1) indice = 0;
    let carta = cartasJoao.splice(indice, 1)[0];
    cartaJogadaJoao = carta;
    cartaJogadaJoaoEl.innerHTML = `<div class="carta-jogada">${carta.valor}<br><small>${carta.naipe}</small></div>`;
    setTimeout(() => verificarSeAmbosJogaram(), 800);
}

// ===== VERIFICAR JOGADA =====
function verificarSeAmbosJogaram() {
    if (!cartaJogadaJogador || !cartaJogadaJoao) return;
    verificarVencedor();
}

function verificarVencedor() {
    let vencedor = null;
    let ultimo = vezDeJogar;

    if (cartaJogadaJogador.forca > cartaJogadaJoao.forca) {
        vitoriasRodadaJogador++;
        resultadoRodadaEl.textContent = `✅ VOCÊ GANHOU! (${vitoriasRodadaJogador} x ${vitoriasRodadaJoao})`;
        vencedor = 'jogador';
    } else if (cartaJogadaJogador.forca < cartaJogadaJoao.forca) {
        vitoriasRodadaJoao++;
        resultadoRodadaEl.textContent = `❌ JOÃO GANHOU! (${vitoriasRodadaJogador} x ${vitoriasRodadaJoao})`;
        vencedor = 'joao';
    } else {
        // CANGOU = EMPATE! NINGUÉM PONTUA! JOGA DE NOVO!
        resultadoRodadaEl.textContent = `🃏 CANGOU! EMPATE! Ninguém pontua! Jogam de novo!`;
        vencedor = ultimo;
    }

    setTimeout(() => {
        cartaJogadaJogadorEl.innerHTML = '';
        cartaJogadaJoaoEl.innerHTML = '';

        // QUEM FIZER 2 → RODADA ACABA!
        if (vitoriasRodadaJogador === 2 || vitoriasRodadaJoao === 2) {
            encerrarRodada();
            return;
        }

        vezDeJogar = vencedor;
        podeJogar = true;
        exibirCartas(); exibirCartasJoao(); atualizarBotoesPedido();
        if (vencedor === 'joao') { podeJogar = false; setTimeout(() => joaoJoga(), 1500); }
    }, 1800);
}

// ===== PEDIDOS DE AUMENTO =====
window.pedirAumento = function(tipo) {
    if (aguardandoResposta) return;
    let indice = ETAPAS.findIndex(e => e.nome === tipo);
    let etapa = ETAPAS[indice];
    aguardandoResposta = true; quemPediu = 'jogador';
    resultadoRodadaEl.textContent = `🔴 VOCÊ PEDE ${tipo.toUpperCase()}! João decide...`;

    setTimeout(() => {
        let forcas = cartasJoao.map(c => c.forca);
        let melhor = Math.max(...forcas);
        let chance = melhor >= 10 ? 0.95 : melhor >= 7 ? 0.70 : melhor >= 4 ? 0.40 : 0.15;
        let aceita = Math.random() < chance;
        if (aceita) {
            indiceEtapa = indice; valorAtualRodada = etapa.valor;
            resultadoRodadaEl.textContent = `✅ JOÃO ACEITOU! Vale ${etapa.valor}pts!`;
        } else {
            pontosJogador += etapa.recusa;
            resultadoRodadaEl.textContent = `🏃 JOÃO CORREU! VOCÊ GANHA +${etapa.recusa}pts!`;
            if (verificarFimDePartida()) return;
        }
        encerraAumento();
    }, 1800);
};

window.aceitarPedido = function() {
    let etapa = ETAPAS[indiceEtapa];
    indiceEtapa++; valorAtualRodada = etapa.valor;
    resultadoRodadaEl.textContent = `✅ VOCÊ ACEITOU! Vale ${etapa.valor}pts!`;
    encerraAumento();
};

window.recusarPedido = function() {
    let etapa = ETAPAS[indiceEtapa];
    pontosJoao += etapa.recusa;
    resultadoRodadaEl.textContent = `🏃 VOCÊ CORREU! JOÃO GANHA +${etapa.recusa}pts!`;
    atualizarPlacar();
    if (verificarFimDePartida()) return;
    encerraAumento();
};

function encerraAumento() {
    aguardandoResposta = false; quemPediu = null;
    atualizarPlacar(); atualizarBotoesPedido();
    if (vezDeJogar === 'joao') { podeJogar = false; setTimeout(() => joaoJoga(), 1500); }
}

function joaoPedeAumento() {
    if (aguardandoResposta || indiceEtapa >= 2) return;
    let forcas = cartasJoao.map(c => c.forca);
    let melhor = Math.max(...forcas);
    let chance = melhor >= 10 ? 0.60 : melhor >= 7 ? 0.35 : 0.12;
    if (Math.random() > chance) return;
    let prox = indiceEtapa + 1;
    if (prox < 0 || prox > 2) return;
    let etapa = ETAPAS[prox];
    aguardandoResposta = true; quemPediu = 'joao'; indiceEtapa = prox;
    resultadoRodadaEl.textContent = `🔴 JOÃO PEDE ${etapa.nome.toUpperCase()}! Você decide!`;
    atualizarBotoesPedido();
}

function atualizarBotoesPedido() {
    if (!areaPedidosEl) return;
    let html = '';
    let naoPede = (pontosJogador === LIMITE_MAO_DE_10) || (pontosJoao === LIMITE_MAO_DE_10);
    if (naoPede && !aguardandoResposta) { areaPedidosEl.innerHTML = ''; return; }

    if (aguardandoResposta && quemPediu === 'joao') {
        let etapa = ETAPAS[indiceEtapa];
        html = `<div style="display:flex; gap:10px; justify-content:center;">
            <button onclick="aceitarPedido()" style="padding:10px 18px; background:#28a745; color:white; border:none; border-radius:8px; font-weight:bold;">✅ ACEITAR (${etapa.valor}pts)</button>
            <button onclick="recusarPedido()" style="padding:10px 18px; background:#dc3545; color:white; border:none; border-radius:8px; font-weight:bold;">❌ CORRER (+${etapa.recusa}pts)</button>
        </div>`;
    } else if (!aguardandoResposta && vezDeJogar === 'jogador' && !naoPede) {
        if (indiceEtapa === -1) html = `<button onclick="pedirAumento('truco')" style="padding:10px 16px; background:${CORES.truco}; color:#000; border:none; border-radius:8px; font-weight:bold;">🎯 TRUCO (4pts)</button>`;
        else if (indiceEtapa === 0) html = `<button onclick="pedirAumento('seis')" style="padding:10px 16px; background:${CORES.seis}; color:#fff; border:none; border-radius:8px; font-weight:bold;">🎯 SEIS (8pts)</button>`;
        else if (indiceEtapa === 1) html = `<button onclick="pedirAumento('nove')" style="padding:10px 16px; background:${CORES.nove}; color:#fff; border:none; border-radius:8px; font-weight:bold;">🎯 NOVE (12pts)</button>`;
    }
    areaPedidosEl.innerHTML = html;
}

// ===== ENCERRAR RODADA =====
function encerrarRodada() {
    rodadaEmAndamento = false; aguardandoResposta = false;
    let voceMaoDeDez = (pontosJogador === LIMITE_MAO_DE_10);
    let joaoMaoDeDez = (pontosJoao === LIMITE_MAO_DE_10);

    if (vitoriasRodadaJogador > vitoriasRodadaJoao) {
        if (joaoMaoDeDez) {
            pontosJogador += 4;
            resultadoRodadaEl.textContent = `🏆 JOÃO PERDEU NA MÃO DE 10! VOCÊ GANHA 4 PONTOS!`;
        } else {
            pontosJogador += valorAtualRodada;
            resultadoRodadaEl.textContent = `🏆 VOCÊ VENCEU A RODADA! +${valorAtualRodada}pts`;
        }
        quemJogaPrimeiro = 'jogador';
    } else {
        if (voceMaoDeDez) {
            pontosJoao += 4;
            resultadoRodadaEl.textContent = `😔 VOCÊ PERDEU NA MÃO DE 10! JOÃO GANHA 4 PONTOS!`;
        } else {
            pontosJoao += valorAtualRodada;
            resultadoRodadaEl.textContent = `😔 JOÃO VENCEU A RODADA! +${valorAtualRodada}pts`;
        }
        quemJogaPrimeiro = 'joao';
    }

    atualizarPlacar();
    if (verificarFimDePartida()) return;
    setTimeout(() => { resultadoRodadaEl.textContent = '🃏 Preparando nova rodada...'; iniciarNovaRodada(); }, 2500);
}

// ===== FIM DE PARTIDA =====
function verificarFimDePartida() {
    if (pontosJogador >= PONTOS_PARTIDA) {
        setTimeout(() => {
            alert(`🎉 PARABÉNS! VOCÊ VENCEU A PARTIDA!\nPlacar Final: ${pontosJogador} x ${pontosJoao}`);
            botaoNovaRodada.style.opacity = '1';
            botaoNovaRodada.style.pointerEvents = 'auto';
        }, 600);
        return true;
    }
    if (pontosJoao >= PONTOS_PARTIDA) {
        setTimeout(() => {
            alert(`😔 JOÃO VENCEU A PARTIDA!\nPlacar Final: ${pontosJogador} x ${pontosJoao}\n⚠️ Mesmo sendo SUA Mão de 10, quem chega em 12 PRIMEIRO GANHA!`);
            botaoNovaRodada.style.opacity = '1';
            botaoNovaRodada.style.pointerEvents = 'auto';
        }, 600);
        return true;
    }
    return false;
}

function atualizarPlacar() {
    placarJogadorEl.textContent = pontosJogador;
    placarJoaoEl.textContent = pontosJoao;
}

// ===== INICIAR JOGO =====
window.onload = function() {
    placarJogadorEl = document.getElementById('placar-jogador');
    placarJoaoEl = document.getElementById('placar-joao');
    cartasJogadorEl = document.getElementById('cartas-jogador');
    cartasJoaoEl = document.getElementById('cartas-joao');
    cartaJogadaJogadorEl = document.getElementById('carta-jogada-jogador');
    cartaJogadaJoaoEl = document.getElementById('carta-jogada-joao');
    resultadoRodadaEl = document.getElementById('resultado-rodada');
    areaPedidosEl = document.getElementById('area-pedidos');
    botaoNovaRodada = document.getElementById('botao-nova-rodada');

    botaoNovaRodada.onclick = () => {
        pontosJogador = pontosJoao = 0;
        atualizarPlacar();
        botaoNovaRodada.style.opacity = '0.3';
        botaoNovaRodada.style.pointerEvents = 'none';
        iniciarNovaRodada();
    };

    iniciarNovaRodada();
};
</script>
</body>
</html>
